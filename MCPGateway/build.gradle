plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.beatengine'
version = '0.0.1-SNAPSHOT'
description = 'MCPGateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.1")
}

bootJar {
    archiveFileName = 'mcpgateway.jar'
}

dependencies {
    implementation 'org.springframework.session:spring-session-core'
    //implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    //implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    //WEBSOCKET API_DOC
    implementation 'io.github.springwolf:springwolf-core:2.9.0'
    implementation 'io.github.springwolf:springwolf-generic-binding:2.9.0'
    implementation 'io.github.springwolf:springwolf-ui:2.9.0'
    implementation 'io.github.springwolf:springwolf-asyncapi:2.9.0'

    //runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
