spring.application.name=MCPGateway
server.port=34589

#Websocket-API-DOC
# Springwolf Configuration
springwolf.docket.base-package=org.beatengine.mcpgateway
springwolf.docket.info.title=${spring.application.name}
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=Infos ${spring.application.name}-Websocket-API
# Enable test messages in UI
springwolf.plugin.generic.publishing.enabled=true
springwolf.plugin.generic.publishing.producer.url=http://localhost:34589/api/v1/test/springwolf-publish
springwolf.use-fqn=true